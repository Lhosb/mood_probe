name: CI

on:
  pull_request:
  push:

jobs:
  rspec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run test suite except frozen baseline algebraic gate
        run: bundle exec rspec --exclude-pattern spec/baseline_v0_1_0_parity_spec.rb

      - name: Run frozen baseline algebraic gate
        run: bundle exec rspec spec/baseline_v0_1_0_parity_spec.rb

  essentia_offline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build amd64 Essentia image
        run: docker build --platform linux/amd64 -f Dockerfile.essentia -t mood-probe-essentia .

      - name: Run model-free Essentia gates
        run: |
          mkdir -p tmp
          docker run --rm --platform linux/amd64 \
            --entrypoint bash \
            -e ESSENTIA_SPECS=1 \
            -e MOOD_PROBE_RESAMPLING_MEASUREMENT=/mood_probe/tmp/resampling_measurement.json \
            -v "$PWD/tmp:/mood_probe/tmp" \
            mood-probe-essentia \
            -c 'bundle exec rspec spec/integration/essentia_offline_spec.rb'

      - name: Upload resampling measurement
        uses: actions/upload-artifact@v4
        with:
          name: resampling-measurement
          path: tmp/resampling_measurement.json
          if-no-files-found: error

  essentia_golden:
    # Native x86_64 matches the app CI and deployment target. AMD64 names an
    # ISA, not a complete execution environment, so emulated amd64 is rejected.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build amd64 Essentia image
        run: docker build --platform linux/amd64 -f Dockerfile.essentia -t mood-probe-essentia .

      # Transport is isolated so 404, timeout, rate-limit, and DNS failures are
      # visibly upstream availability failures rather than gem regressions.
      - name: Fetch models (upstream transport)
        run: |
          mkdir -p tmp/models
          docker run --rm --platform linux/amd64 \
            --entrypoint bash \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/tmp/models:/models" \
            mood-probe-essentia \
            -c 'bundle exec ruby script/fetch_models_transport.rb /models'

      # No retry spans this step: a mismatch means upstream bytes changed.
      - name: Verify model digests (upstream checksum drift)
        run: |
          docker run --rm --platform linux/amd64 \
            --entrypoint bash \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/tmp/models:/models:ro" \
            mood-probe-essentia \
            -c 'bundle exec ruby -Ilib exe/mood-probe --models-dir /models models verify'

      # This step must finish before the comparison starts. Import failures,
      # preflight timeouts, OOM, and container death are environment failures,
      # not evidence that the numeric assertion ran and failed.
      - name: Capture native outputs (environment incapable)
        run: |
          mkdir -p tmp/actual
          docker run --rm --platform linux/amd64 \
            --entrypoint bash \
            --user "$(id -u):$(id -g)" \
            -e MOOD_PROBE_MODELS_DIR=/models \
            -v "$PWD/tmp/models:/models:ro" \
            -v "$PWD/tmp/actual:/actual" \
            mood-probe-essentia \
            -c 'bundle exec ruby script/capture_essentia_outputs.rb /actual'

      - name: Run golden regression gate (our regression)
        run: |
          set +e
          output="$(
            docker run --rm --platform linux/amd64 \
              --entrypoint bash \
              --user "$(id -u):$(id -g)" \
              -e ESSENTIA_SPECS=1 \
              -e MOOD_PROBE_ACTUAL_ROOT=/actual \
              -v "$PWD/tmp/actual:/actual:ro" \
              mood-probe-essentia \
              -c '
                bundle exec rspec spec/integration/essentia_golden_spec.rb --format progress
              '
          )"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          grep -F "2 examples, 0 failures" <<<"$output"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.12.11"
          args: "check python spec/support"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop
